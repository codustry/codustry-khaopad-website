# codustry.com — marketing site for Codustry (Thailand) Co., Ltd.
# Built on Khao Pad (codustry/khaopad). `upstream` remote carries engine fixes.
#
# Resource IDs are provisioned once per project (see scripts/setup.ts):
#   wrangler d1 create codustry-website-db
#   wrangler r2 bucket create codustry-website-media
#   wrangler kv namespace create CONTENT_CACHE
name = "codustry-website"
account_id = "4becdbe083803fc00f06fdfb6d0bcc17" # Codustry
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"
assets = { directory = ".svelte-kit/cloudflare", binding = "ASSETS" }

# Custom domain — enable after DNS review:
# routes = [
#   { pattern = "codustry.com/*", zone_name = "codustry.com" },
#   { pattern = "www.codustry.com/*", zone_name = "codustry.com" },
# ]

[[d1_databases]]
binding = "DB"
database_name = "codustry-website-db"
database_id = "b225d92d-2a53-4bbd-8541-e3135e7df836"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "codustry-website-media"

[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "ed4b892b93d746de8fdcf000225a9306"

[vars]
# Anything except "production" (including unset) is noindexed — fail-closed.
WORKERS_ENV = "staging"
SUPPORTED_LOCALES = "en,th"
DEFAULT_LOCALE = "en"
# Switch all three to https://codustry.com when the custom domain is attached
# (and flip WORKERS_ENV to "production" to allow indexing).
PUBLIC_SITE_URL = "https://codustry-website.codustry.workers.dev"
CMS_SITE_URL = "https://codustry-website.codustry.workers.dev"
BETTER_AUTH_URL = "https://codustry-website.codustry.workers.dev"

# Job openings come from Tonbab People (codustry/workflow). Swap to the
# production host — https://api.tonbab.com/v1/public/careers/codustry/jobs
# — once that DNS is live; nothing else needs to change.
CAREERS_API_URL = "https://dev.app.tonbab.com/v1/public/careers/codustry/jobs"
