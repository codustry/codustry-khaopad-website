# codustry.com — marketing site for Codustry (Thailand) Co., Ltd.
# Built on Khao Pad (codustry/khaopad). `upstream` remote carries engine fixes.
#
# Resource IDs are provisioned once per project (see scripts/setup.ts):
#   wrangler d1 create codustry-website-db
#   wrangler r2 bucket create codustry-website-media
#   wrangler kv namespace create CONTENT_CACHE
name = "codustry-website"
account_id = "4becdbe083803fc00f06fdfb6d0bcc17" # Codustry
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"
assets = { directory = ".svelte-kit/cloudflare", binding = "ASSETS" }

# Custom domain — enable after DNS review:
# routes = [
#   { pattern = "codustry.com/*", zone_name = "codustry.com" },
#   { pattern = "www.codustry.com/*", zone_name = "codustry.com" },
# ]

[[d1_databases]]
binding = "DB"
database_name = "codustry-website-db"
database_id = "b225d92d-2a53-4bbd-8541-e3135e7df836"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "codustry-website-media"

# ─── Auth rate limiting (#182, upstream v4.3) ─────────────────
# Cloudflare per-colo rate limiter guarding credential endpoints
# (sign-in, change-password, OTP send). `simple.limit` is attempts per
# `period` seconds per key (ip|path); period must be 10 or 60.
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1821"
simple = { limit = 5, period = 10 }

[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "ed4b892b93d746de8fdcf000225a9306"

[vars]
# Anything except "production" (including unset) is noindexed — fail-closed.
# Now live on the custom domain, so indexing is allowed.
WORKERS_ENV = "production"
SUPPORTED_LOCALES = "en,th"
DEFAULT_LOCALE = "en"
# www is canonical: the apex 301s to it via a Redirect Rule, and both
# hostnames are attached to this Worker as Custom Domains.
PUBLIC_SITE_URL = "https://www.codustry.com"
# Sender for all transactional email (Resend). The API key itself is a
# secret — set via /admin/settings/secrets or `wrangler secret put
# RESEND_API_KEY`. Without BOTH, email senders silently no-op.
RESEND_FROM = "no-reply@codustry.com"
CMS_SITE_URL = "https://www.codustry.com"
BETTER_AUTH_URL = "https://www.codustry.com"

# ─── @khaopad/plugin-careers ──────────────────────────────────
# Public job feed for /{locale}/careers (Tonbab People). Unset = the
# careers route 404s and its nav entry hides. Not a secret: the feed is
# public, unauthenticated and read-only, so [vars] is the right home.
CAREERS_FEED_URL = "https://api.tonbab.com/v1/public/careers/codustry/jobs"
